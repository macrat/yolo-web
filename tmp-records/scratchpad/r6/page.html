<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(IBMPlexSans-Regular-Latin1.woff2);font-weight:400;unicode-range:U+0000-007F}
@font-face{font-family:Plex;src:url(IBMPlexSans-Bold-Latin1.woff2);font-weight:700;unicode-range:U+0000-007F}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:Plex,"IPAPGothic",sans-serif;font-size:1.0625rem;line-height:1.85;width:288px;padding:0}
button{font-family:inherit;font-size:inherit}
[data-text-box="inline"]{padding-inline:8px;margin-inline-start:-8px}
[data-text-box="rows"]>li{padding-inline:8px}
.phrased{word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
/* Button */
.button{display:inline-flex;align-items:center;min-width:44px;min-height:44px;padding-block:8px;flex-shrink:0;max-width:100%;border:none;border-radius:0;line-height:1.4;text-align:start;cursor:pointer}
.variantDefault{background:transparent;color:#000;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.15em}
/* shared face rule as listed in the design: size, leading, block padding, min-height, center */
.face{display:inline-flex;align-items:center;min-height:44px;padding-block:8px;line-height:1.4}
.full{min-width:44px;flex-shrink:0;max-width:100%}
.choices{list-style:none;border-top:1px solid #888}
.choice{position:relative;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:.75rem;border-bottom:1px solid #888}
.tag{flex-shrink:0;font-size:.875rem;font-weight:700;white-space:nowrap}
.bold{font-weight:700}
</style></head><body><div id="root"></div></body></html>
