<!doctype html><html><head><style>
body{margin:0;padding:20px;background:#fcfcfc}
input[type=range]{-webkit-appearance:none;appearance:none;width:93px;height:44px;margin:0;background:transparent;display:block}
input[type=range]::-webkit-slider-runnable-track{box-sizing:border-box;height:16px;border:1px solid #999;background:var(--track);background-origin:border-box}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;box-sizing:border-box;width:16px;height:32px;margin-top:-9px;border:3px solid #000;background:rgb(255,0,0)}
body.hide input[type=range]::-webkit-slider-thumb{opacity:0}
</style></head><body><input id="r" type="range" min="0" max="360" value="180"></body></html>
